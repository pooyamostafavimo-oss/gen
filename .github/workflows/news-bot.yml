name: Economic News Bot

on:
  schedule:
    # Runs every 30 minutes (UTC)
    - cron: "*/30 * * * *"
  workflow_dispatch: {}   # allows manual run from the Actions tab

concurrency:
  group: news-bot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
          # Comma-separated list of Gemini keys, e.g. "AIza...1,AIza...2"
          # Add a secret named GEMINI_API_KEYS in your repo settings.
          # (GEMINI_API_KEY still works as a single-key fallback if you keep using that name instead.)
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
        run: python bot.py

      - name: Commit updated posted.json
        run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add posted.json
          git diff --cached --quiet || git commit -m "update posted news history [skip ci]"
          git push
